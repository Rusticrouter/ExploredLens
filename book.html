<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book a Session · Explored Lens Photography</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QC2S9YYN9E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QC2S9YYN9E');
  </script>
</head>

<body>
  <div class="wrapper">
    <header>
      <nav class="site-nav">
        <div class="logo">Explored Lens Photography</div>

        <!-- Mobile menu toggle -->
        <button class="nav-toggle" aria-expanded="false" aria-label="Toggle navigation">
          ☰
        </button>

        <!-- Nav links -->
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="prints.html">Prints</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="book.html">Book</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="section">
        <h2>Book a Session</h2>
        <p>
          Interested in a photography session or fine-art prints?
          Fill out the form below and I’ll get back to you as soon as possible.
        </p>
      </section>

      <section class="section">
        <div class="card">
          <form 
            action="https://formspree.io/f/manrevwo"
            method="POST"
            class="contact-form">

            <label>
              Full Name
              <input type="text" name="name" required>
            </label>

            <label>
              Email Address
              <input type="email" name="email" required>
            </label>

            <label>
              Phone Number (optional)
              <input type="text" name="phone">
            </label>

            <label>
              What are you interested in?
              <select name="session_type" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Families">Families</option>
                <option value="Couples">Couples</option>
                <option value="Engagement">Engagement</option>
                <option value="Headshots">Headshots</option>
                <option value="Fine Art Prints">Fine Art Prints</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <label>
              Message
              <textarea name="message" rows="6" placeholder="Tell me a little about what you're looking for..." required></textarea>
            </label>

            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      &copy; <span id="year"></span> Explored Lens Photography | Seacoast, NH
    </footer>
  </div>

  <!-- Mobile nav JS + Year -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');

    navToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('nav-open');
      navToggle.setAttribute('aria-expanded', isOpen);
    });
  </script>
</body>
</html>
